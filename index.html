<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Where is Tom going?</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body > div {
        max-width: 800px;
        margin: 0 auto;
      }

      #map {
        width: 100%;
        height: 375px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="content"></div>

    <script type="text/babel">
      var GOOGLE_API_KEY = 'AIzaSyA5MT_w7rT7G5QTs_7o7at4_o6a7u2oGpc';
      var CALENDAR_ID = 'rc0dk12tq77tvfv49le0p5mro8@group.calendar.google.com';

      var map = null;
      var geocoder = null;
      var openedInfoWindow = null;

      var DestinationsList = React.createClass({
        getInitialState: function() {
          return {
            destinations: []
          };
        },
        componentDidMount: function() {
          $.get(encodeURI('https://www.googleapis.com/calendar/v3/calendars/' + CALENDAR_ID + '/events?key=' + GOOGLE_API_KEY), function (response) {
              if (response.items) {
                this.setState({
                  destinations: response.items
                    .sort(function(a, b) { return a.start.date.localeCompare(b.start.date); })
                    .map(function(dest, i) {
                      return {
                        name: dest.summary,
                        start: moment(dest.start.date, 'YYYY-MM-DD').format('MM/DD/YYYY'),
                        end: moment(dest.end.date, 'YYYY-MM-DD').subtract(1, 'days').format('MM/DD/YYYY'),
                        duration: moment(dest.end.date, 'YYYY-MM-DD').subtract(1, 'days').diff(moment(dest.start.date, 'YYYY-MM-DD'), 'days'),
                        location: dest.location || ''
                      };
                    }.bind(this))
                });
              }
            }.bind(this)
          );
        },
        render: function() {
          return (
            <table className="table table-hover table-condensed">
              <thead><tr><th>Location</th><th>Start</th><th>End</th><th>Days</th></tr></thead>
              <tbody>
                {
                  this.state.destinations
                    .map(function(dest, index) {
                      return (<DestinationsRow key={index} idx={index} destination={dest} />)
                    })
                }
              </tbody>
            </table>
          )
        }
      });

      var DestinationsRow = React.createClass({
        propTypes: {
          destination: React.PropTypes.object.isRequired
        },
        getInitialState: function() {
          return {
            infoWindow: null,
            marker: null,
          };
        },
        dropPin: function(location) {
          var contentString = '<div>'+
                                '<h5>' + this.props.destination.name + '</h5>'+
                                '<p>' + this.props.destination.start + ' - ' + this.props.destination.end + '</p>' +
                              '</div>';

          var marker = new google.maps.Marker({
            map: map,
            position: location,
            title: this.props.destination.name,
            animation: google.maps.Animation.DROP
          });

          this.setState({
            marker: marker,
            infoWindow: new google.maps.InfoWindow({ content: contentString })
          });

          marker.addListener('click', this.openInfoWindow);
        },
        openInfoWindow: function() {
          if (openedInfoWindow) {
            openedInfoWindow.close();
          }
          this.state.infoWindow.open(map, this.state.marker);
          openedInfoWindow = this.state.infoWindow;
        },
        closeInfoWindow: function() {
          this.state.infoWindow.close();
        },
        handleClick: function(e) {
          e.preventDefault();

          this.openInfoWindow();
        },
        componentDidMount: function() {
          var location = window.localStorage.getItem(this.props.destination.location);
          if (location) {
            this.dropPin(JSON.parse(location));
          } else {
            setTimeout(function() {
              geocoder.geocode({'address': this.props.destination.location}, function(results, status) {
                if (status == google.maps.GeocoderStatus.OK) {
                  this.dropPin(results[0].geometry.location);
                  window.localStorage.setItem(this.props.destination.location, JSON.stringify(results[0].geometry.location));
                } else {
                  console.log(status);
                }
              }.bind(this))
            }.bind(this), 600 * i);
          }
        },
        render: function() {
          return (
            <tr onClick={this.handleClick}>
              <td>{this.props.destination.name}</td>
              <td>{this.props.destination.start}</td>
              <td>{this.props.destination.end}</td>
              <td>{this.props.destination.duration}</td>
            </tr>
          )
        }
      });

      window.init = function() {
        map = new google.maps.Map(document.getElementById('map'), {
          scrollwheel: false,
          zoom: 2,
          center: {lat: 10, lng: 12},
          mapTypeControl: false,
          streetViewControl: false
        });

        geocoder = new google.maps.Geocoder();

        ReactDOM.render(
          <DestinationsList />,
          document.getElementById('content')
        );
      };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/0.14.4/react.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/0.14.4/react-dom.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.11.0/moment.min.js"></script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA5MT_w7rT7G5QTs_7o7at4_o6a7u2oGpc&callback=init"></script>
  </body>
</html>
